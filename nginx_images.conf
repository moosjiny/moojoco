server {
    listen 80;
    server_name images.hyperbook.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name images.hyperbook.com;

    ssl_certificate     /home/moos/dev_ws/dual_arms/certs/images/fullchain.pem;
    ssl_certificate_key /home/moos/dev_ws/dual_arms/certs/images/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /home/moos/dev_ws/images;
    autoindex off;

    location / {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }
}
