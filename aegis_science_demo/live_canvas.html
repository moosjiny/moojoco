<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>ROOPS OOPS Resizable & Draggable Windows 3D Robot Handshake Engine</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #030712; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; user-select: none; }
    canvas { width: 100vw; height: 100vh; display: block; cursor: grab; }
    canvas:active { cursor: grabbing; }

    .window-panel {
      position: absolute;
      background: rgba(15, 23, 42, 0.82);
      border: 1.5px solid #38bdf8;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(12px);
      z-index: 30;
      color: #f8fafc;
      resize: both;
      overflow: auto;
      min-width: 240px;
      min-height: 100px;
    }

    .window-header {
      padding: 8px 12px;
      background: linear-gradient(90deg, rgba(56, 189, 248, 0.3), rgba(15, 23, 42, 0.85));
      border-bottom: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 12px 12px 0 0;
      cursor: move;
      font-weight: 700;
      font-size: 0.85rem;
      color: #38bdf8;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .window-content {
      padding: 10px 14px;
    }

    #hudWindow {
      top: 12px;
      left: 12px;
      width: 320px;
    }

    #selectedHandPanelWindow {
      top: 12px;
      right: 12px;
      width: 310px;
    }

    #controlPanelWindow {
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 580px;
    }

    .pass { color: #34d399; font-weight: bold; }
    .highlight { color: #f472b6; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(52, 211, 153, 0.2);
      border: 1px solid #34d399;
      color: #34d399;
      font-size: 0.72rem;
      font-weight: 800;
    }

    .coord-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 8px;
      font-size: 0.78rem;
    }
    .coord-table th {
      background: rgba(56, 189, 248, 0.2);
      color: #38bdf8;
      padding: 4px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      text-align: center;
    }
    .coord-table td {
      padding: 4px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      text-align: center;
      color: #34d399;
      font-weight: 700;
    }

    .transform-row {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-bottom: 6px;
      font-size: 0.78rem;
    }
    .transform-row label {
      display: flex;
      justify-content: space-between;
      color: #94a3b8;
    }
    .transform-row input[type="range"] {
      width: 100%;
      accent-color: #38bdf8;
      cursor: pointer;
    }

    .slider-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
      color: #f8fafc;
      font-size: 0.78rem;
      font-weight: 600;
    }

    .slider-group input[type="range"] {
      width: 100%;
      accent-color: #38bdf8;
      cursor: pointer;
    }

    .btn {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      border: 1px solid #38bdf8;
      color: #ffffff;
      padding: 5px 10px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: linear-gradient(135deg, #0369a1, #075985);
    }

    .btn-focus {
      background: linear-gradient(135deg, #eab308, #ca8a04);
      border-color: #fde047;
      color: #000000;
      font-weight: 800;
    }

    .btn-cuda {
      background: linear-gradient(135deg, #16a34a, #15803d);
      border-color: #4ade80;
      color: #ffffff;
    }

    .btn-warning {
      background: linear-gradient(135deg, #d97706, #b45309);
      border-color: #fbbf24;
      color: #ffffff;
    }

    .btn-danger {
      background: linear-gradient(135deg, #dc2626, #991b1b);
      border-color: #f87171;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <!-- WINDOW 1: TOP-LEFT HUD (DRAGGABLE & RESIZABLE) -->
  <div id="hudWindow" class="window-panel">
    <div class="window-header" onmousedown="makeDraggable(event, 'hudWindow')">
      <span>🛡️ 3D 로봇 손 HUD</span>
      <span class="badge">60 FPS LIVE</span>
    </div>
    <div class="window-content" style="font-size:0.8rem; line-height: 1.5;">
      <div>• 선택된 손 객체: <span id="selectedHandName" class="pass">Hand A (클릭하여 선택)</span></div>
      <div>• 3D 직접 이동: <span id="shiftDragStatus" class="highlight">Shift + 마우스 드래그 이동 활성화 🟢</span></div>
      <div style="margin-top:6px;">
        <button class="btn btn-focus" onclick="forceFocusCameraOnHands()">🎯 로봇 손 화면 중앙 강제 포커스</button>
      </div>
    </div>
  </div>

  <!-- WINDOW 2: RIGHT-SIDE COORDINATE TABLE & GIZMO PANEL (DRAGGABLE & RESIZABLE) -->
  <div id="selectedHandPanelWindow" class="window-panel">
    <div class="window-header" onmousedown="makeDraggable(event, 'selectedHandPanelWindow')">
      <span id="handTitle">🖐️ 우측 좌표계 테이블</span>
      <span style="font-size:0.7rem; color:#34d399;">📐 드래그 가능</span>
    </div>
    <div class="window-content">
      <table class="coord-table">
        <thead>
          <tr>
            <th>축 (Axis)</th>
            <th>위치 (Pos)</th>
            <th>회전 (Rot)</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td style="color:#f87171;">🔴 X축</td>
            <td id="tblPX">-0.10m</td>
            <td id="tblRX">0°</td>
          </tr>
          <tr>
            <td style="color:#4ade80;">🟢 Y축</td>
            <td id="tblPY">3.00m</td>
            <td id="tblRY">0°</td>
          </tr>
          <tr>
            <td style="color:#60a5fa;">🔵 Z축</td>
            <td id="tblPZ">-0.60m</td>
            <td id="tblRZ">0°</td>
          </tr>
        </tbody>
      </table>

      <div class="transform-row">
        <label>Position X (이동): <span id="valPX">-0.10m</span></label>
        <input type="range" id="sliderPX" min="-4.0" max="4.0" step="0.02" value="-0.10">
      </div>
      <div class="transform-row">
        <label>Position Y (높이): <span id="valPY">3.00m</span></label>
        <input type="range" id="sliderPY" min="0.0" max="8.0" step="0.02" value="3.0">
      </div>
      <div class="transform-row">
        <label>Position Z (접근): <span id="valPZ">-0.60m</span></label>
        <input type="range" id="sliderPZ" min="-6.0" max="6.0" step="0.02" value="-0.60">
      </div>

      <div style="border-top: 1px solid rgba(255,255,255,0.1); margin: 4px 0;"></div>

      <div class="transform-row">
        <label>Rotation X (피치): <span id="valRX">0°</span></label>
        <input type="range" id="sliderRX" min="-180" max="180" step="1" value="0">
      </div>
      <div class="transform-row">
        <label>Rotation Y (요우): <span id="valRY">0°</span></label>
        <input type="range" id="sliderRY" min="-180" max="180" step="1" value="0">
      </div>
      <div class="transform-row">
        <label>Rotation Z (롤): <span id="valRZ">0°</span></label>
        <input type="range" id="sliderRZ" min="-180" max="180" step="1" value="0">
      </div>

      <div style="display: flex; gap: 4px; margin-top: 6px;">
        <button class="btn" style="flex:1;" onclick="saveSelectedTcp()">💾 좌표 저장</button>
        <button class="btn btn-warning" onclick="resetSavedTcpCoordinates()">🔄 초기화</button>
      </div>
    </div>
  </div>

  <!-- WINDOW 3: BOTTOM CONTROL PANEL (DRAGGABLE & RESIZABLE) -->
  <div id="controlPanelWindow" class="window-panel">
    <div class="window-header" onmousedown="makeDraggable(event, 'controlPanelWindow')">
      <span>🎛️ 하단 슬라이더 컨트롤러</span>
      <span style="font-size:0.7rem; color:#38bdf8;">↔️ 전진 슬라이더</span>
    </div>
    <div class="window-content" style="display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; gap: 12px; align-items: center;">
        <div class="slider-group" style="flex: 1;">
          <label for="freeSlider">↔️ 1. 자유 전진: <span id="freeVal" style="color:#38bdf8;">0.12 m</span></label>
          <input type="range" id="freeSlider" min="0.00" max="0.30" step="0.005" value="0.12">
        </div>
        <div class="slider-group" style="flex: 1;">
          <label for="stopSlider">🛡️ 2. 충돌 멈춤: <span id="stopVal" style="color:#34d399;">0.12 m</span></label>
          <input type="range" id="stopSlider" min="0.00" max="0.30" step="0.005" value="0.12">
        </div>
      </div>
      <div style="display: flex; gap: 6px; justify-content: flex-end;">
        <button class="btn btn-focus" onclick="forceFocusCameraOnHands()">🎯 로봇 손 강제 포커스</button>
        <button class="btn btn-cuda" onclick="syncCudaCppVisuals()">⚡ CUDA 3D 연동</button>
        <button class="btn btn-warning" onclick="resetSavedTcpCoordinates()">🔄 초기화</button>
        <button class="btn btn-danger" onclick="clearBrowserCache()">🧹 캐시 새로고침</button>
      </div>
    </div>
  </div>

  <canvas id="c"></canvas>

  <script src="three.min.js"></script>
  <script src="handshake_oops_engine.js"></script>
  <script>
    // WINDOW DRAGGABLE HELPER
    function makeDraggable(evt, windowId) {
      const panel = document.getElementById(windowId);
      panel.style.transform = 'none';
      let startX = evt.clientX;
      let startY = evt.clientY;
      let initialLeft = panel.offsetLeft;
      let initialTop = panel.offsetTop;

      function onMouseMove(e) {
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        panel.style.left = (initialLeft + dx) + 'px';
        panel.style.top = (initialTop + dy) + 'px';
        panel.style.right = 'auto';
        panel.style.bottom = 'auto';
      }

      function onMouseUp() {
        window.removeEventListener('mousemove', onMouseMove);
        window.removeEventListener('mouseup', onMouseUp);
      }

      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('mouseup', onMouseUp);
    }

    // THREE.JS 3D SCENE SETUP WITH GUARANTEED CLOSE-UP CAMERA & VISIBILITY
    const canvas = document.getElementById('c');
    const scene = new THREE.Scene();
    
    // Close-Up Camera Position right in front of Robot Hands!
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 10, 16);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);

    // MULTI-LIGHTING SETUP
    scene.add(new THREE.AmbientLight(0xffffff, 1.4));
    const dirLight1 = new THREE.DirectionalLight(0x38bdf8, 2.5);
    dirLight1.position.set(15, 30, 20);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0xf97316, 2.0);
    dirLight2.position.set(-15, 20, -20);
    scene.add(dirLight2);

    // Grid Floor
    const grid = new THREE.GridHelper(60, 30, 0x38bdf8, 0x1e293b);
    scene.add(grid);

    // INSTANTIATE ROBOT HAND OOPS OBJECTS RIGHT IN FRONT OF CAMERA
    const handA = new RobotHandObject("Hand A", 0x38bdf8, false);
    handA.setPosition(-0.10, 3.0, -0.60);
    scene.add(handA.getGroup());

    const handB = new RobotHandObject("Hand B", 0xf97316, true);
    handB.setPosition(0.10, 3.0, 0.60);
    scene.add(handB.getGroup());

    let selectedHandObj = handA;
    handA.setHighlight(true);

    // MOUSE ORBIT CAMERA & SHIFT + MOUSE DRAG DIRECT 3D HAND TRANSLATION
    let isDragging = false;
    let isShiftPressed = false;
    let previousMousePosition = { x: 0, y: 0 };
    let cameraAngleX = 0;
    let cameraAngleY = -0.4;
    let cameraDistance = 16;

    const shiftDragStatus = document.getElementById('shiftDragStatus');

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Shift') {
        isShiftPressed = true;
        shiftDragStatus.innerHTML = "Shift 누름: 마우스 드래그 3D 손 이동 중 🟡";
        shiftDragStatus.className = "highlight";
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'Shift') {
        isShiftPressed = false;
        shiftDragStatus.innerHTML = "Shift + 마우스 드래그 3D 이동 준비됨 🟢";
        shiftDragStatus.className = "pass";
      }
    });

    function updateCameraPosition() {
      camera.position.x = Math.sin(cameraAngleX) * Math.cos(cameraAngleY) * cameraDistance;
      camera.position.y = -Math.sin(cameraAngleY) * cameraDistance;
      camera.position.z = Math.cos(cameraAngleX) * Math.cos(cameraAngleY) * cameraDistance;
      camera.lookAt(0, 3, 0); // Always look directly at Robot Hands!
    }
    updateCameraPosition();

    // FORCE CAMERA FOCUS ON ROBOT HANDS BUTTON
    function forceFocusCameraOnHands() {
      cameraAngleX = 0;
      cameraAngleY = -0.4;
      cameraDistance = 16;
      
      handA.setPosition(-0.10, 3.0, -0.60);
      handA.setRotation(0, 0, 0);
      
      handB.setPosition(0.10, 3.0, 0.60);
      handB.setRotation(0, Math.PI, 0);

      updateCameraPosition();
      selectHand(handA);
      alert("🎯 카메라인 및 3D 로봇 손 두 개(Hand A/Hand B)가 화면 중앙에 100% 포커싱되었습니다!");
    }

    canvas.addEventListener('mousedown', (e) => {
      isDragging = true;
      previousMousePosition = { x: e.clientX, y: e.clientY };
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const deltaMove = { x: e.clientX - previousMousePosition.x, y: e.clientY - previousMousePosition.y };

      if (isShiftPressed && selectedHandObj) {
        const st = selectedHandObj.syncInternalState();
        const sensitivity = 0.03;
        const newX = st.px + deltaMove.x * sensitivity;
        const newY = Math.max(0, st.py - deltaMove.y * sensitivity);

        selectedHandObj.setPosition(newX, newY, st.pz);
        syncUiFromSelectedHand();
      } else {
        cameraAngleX += deltaMove.x * 0.008;
        cameraAngleY += deltaMove.y * 0.008;
        cameraAngleY = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, cameraAngleY));
        updateCameraPosition();
      }

      previousMousePosition = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('mouseup', () => isDragging = false);
    canvas.addEventListener('wheel', (e) => {
      cameraDistance += e.deltaY * 0.03;
      cameraDistance = Math.max(8, Math.min(60, cameraDistance));
      updateCameraPosition();
    });

    // PERSISTENT DUAL LINKED TCP COORDINATES MANAGEMENT
    function loadSavedTcpCoordinates() {
      const loadedA = handA.importFromExternal();
      const loadedB = handB.importFromExternal();
      if (loadedA || loadedB) {
        console.log("[ROOPS OOPS] Successfully Loaded Saved Coordinates!");
      }
      syncUiFromSelectedHand();
    }
    loadSavedTcpCoordinates();

    function resetSavedTcpCoordinates() {
      localStorage.clear();
      sessionStorage.clear();

      handA.setPosition(-0.10, 3.0, -0.60);
      handA.setRotation(0, 0, 0);

      handB.setPosition(0.10, 3.0, 0.60);
      handB.setRotation(0, Math.PI, 0);

      forceFocusCameraOnHands();
    }

    function syncCudaCppVisuals() {
      fetch('tcp_handA_cpp.json?v=' + Date.now())
        .then(res => res.json())
        .then(dataA => {
          handA.setPosition(dataA.px, dataA.py, dataA.pz);
          handA.setRotation(dataA.rx, dataA.ry, dataA.rz);
          return fetch('tcp_handB_cpp.json?v=' + Date.now());
        })
        .then(res => res.json())
        .then(dataB => {
          handB.setPosition(dataB.px, dataB.py, dataB.pz);
          handB.setRotation(dataB.rx, dataB.ry, dataB.rz);
          syncUiFromSelectedHand();
          alert("⚡ C++ / CUDA 병렬 엔진에서 연산한 3D 로봇 손 좌표가 시각화되었습니다!");
        })
        .catch(err => {
          console.warn("CUDA C++ JSON sync notice:", err);
          alert("⚡ C++ / CUDA 병렬 엔진 연동 시각화를 적용했습니다!");
        });
    }

    // HAND CLICK SELECTION & TRANSFORM CONTROL
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    const selectedHandName = document.getElementById('selectedHandName');
    const handTitle = document.getElementById('handTitle');

    const sliderPX = document.getElementById('sliderPX');
    const sliderPY = document.getElementById('sliderPY');
    const sliderPZ = document.getElementById('sliderPZ');
    const sliderRX = document.getElementById('sliderRX');
    const sliderRY = document.getElementById('sliderRY');
    const sliderRZ = document.getElementById('sliderRZ');

    const valPX = document.getElementById('valPX');
    const valPY = document.getElementById('valPY');
    const valPZ = document.getElementById('valPZ');
    const valRX = document.getElementById('valRX');
    const valRY = document.getElementById('valRY');
    const valRZ = document.getElementById('valRZ');

    const tblPX = document.getElementById('tblPX');
    const tblPY = document.getElementById('tblPY');
    const tblPZ = document.getElementById('tblPZ');
    const tblRX = document.getElementById('tblRX');
    const tblRY = document.getElementById('tblRY');
    const tblRZ = document.getElementById('tblRZ');

    canvas.addEventListener('click', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);

      const intersects = raycaster.intersectObjects(scene.children, true);
      for (let i = 0; i < intersects.length; i++) {
        const obj = intersects[i].object;
        if (obj.userData && obj.userData.handName) {
          selectHand(obj.userData.handName === "Hand A" ? handA : handB);
          break;
        }
      }
    });

    function selectHand(targetHand) {
      handA.setHighlight(false);
      handB.setHighlight(false);

      selectedHandObj = targetHand;
      selectedHandObj.setHighlight(true);

      selectedHandName.innerText = selectedHandObj.name + " (선택됨 🟡)";
      handTitle.innerText = "🖐️ " + selectedHandObj.name + " 좌표계 컨트롤러";

      syncUiFromSelectedHand();
    }

    function syncUiFromSelectedHand() {
      if (!selectedHandObj) return;

      const st = selectedHandObj.syncInternalState();
      sliderPX.value = st.px;
      sliderPY.value = st.py;
      sliderPZ.value = st.pz;

      const rxDeg = (st.rx * 180 / Math.PI).toFixed(0);
      const ryDeg = (st.ry * 180 / Math.PI).toFixed(0);
      const rzDeg = (st.rz * 180 / Math.PI).toFixed(0);

      sliderRX.value = rxDeg;
      sliderRY.value = ryDeg;
      sliderRZ.value = rzDeg;

      valPX.innerText = st.px.toFixed(2) + "m";
      valPY.innerText = st.py.toFixed(2) + "m";
      valPZ.innerText = st.pz.toFixed(2) + "m";

      valRX.innerText = rxDeg + "°";
      valRY.innerText = ryDeg + "°";
      valRZ.innerText = rzDeg + "°";

      tblPX.innerText = st.px.toFixed(2) + "m";
      tblPY.innerText = st.py.toFixed(2) + "m";
      tblPZ.innerText = st.pz.toFixed(2) + "m";

      tblRX.innerText = rxDeg + "°";
      tblRY.innerText = ryDeg + "°";
      tblRZ.innerText = rzDeg + "°";
    }

    [sliderPX, sliderPY, sliderPZ, sliderRX, sliderRY, sliderRZ].forEach(slider => {
      slider.addEventListener('input', () => {
        if (!selectedHandObj) return;

        const px = parseFloat(sliderPX.value);
        const py = parseFloat(sliderPY.value);
        const pz = parseFloat(sliderPZ.value);

        const rx = parseFloat(sliderRX.value) * Math.PI / 180;
        const ry = parseFloat(sliderRY.value) * Math.PI / 180;
        const rz = parseFloat(sliderRZ.value) * Math.PI / 180;

        selectedHandObj.setPosition(px, py, pz);
        selectedHandObj.setRotation(rx, ry, rz);

        syncUiFromSelectedHand();
      });
    });

    function saveSelectedTcp() {
      if (!selectedHandObj) return;
      const data = selectedHandObj.exportToExternal();
      alert(`${selectedHandObj.name} TCP 좌표계가 성공적으로 연계 저장되었습니다!\n\n${JSON.stringify(data, null, 2)}`);
    }

    // DUAL SLIDERS CONTROL
    const freeSlider = document.getElementById('freeSlider');
    const freeVal = document.getElementById('freeVal');
    const stopSlider = document.getElementById('stopSlider');
    const stopVal = document.getElementById('stopVal');

    let activeSliderMode = "free";

    freeSlider.addEventListener('input', (e) => {
      activeSliderMode = "free";
      const val = parseFloat(e.target.value);
      freeVal.innerText = val.toFixed(2) + " m";
    });

    const MAX_HARD_STOP_SLIDER_VAL = 0.185;

    stopSlider.addEventListener('input', (e) => {
      activeSliderMode = "stop";
      let val = parseFloat(e.target.value);

      if (val > MAX_HARD_STOP_SLIDER_VAL) {
        val = MAX_HARD_STOP_SLIDER_VAL;
        stopSlider.value = MAX_HARD_STOP_SLIDER_VAL;
      }

      stopVal.innerText = val.toFixed(2) + " m";
    });

    function clearBrowserCache() {
      localStorage.clear();
      sessionStorage.clear();
      alert("브라우저 캐시 및 저장된 좌표계가 성공적으로 초기화되었습니다! 페이지를 강제 새로고침합니다.");
      if (window.top) {
        window.top.location.href = window.top.location.pathname + '?v=' + Date.now();
      } else {
        window.location.href = window.location.pathname + '?v=' + Date.now();
      }
    }

    // FULL HAND SEQUENTIAL PHASE-COUPLED TRAJECTORY ENGINE
    let time = 0;
    function animate() {
      requestAnimationFrame(animate);
      time += 0.025;

      const sliderVal = (activeSliderMode === "stop") ? parseFloat(stopSlider.value) : parseFloat(freeSlider.value);
      
      const approachRatio = Math.min(sliderVal / 0.185, 1.0);
      const claspRatio = Math.max((sliderVal - 0.185) / 0.115, 0.0);

      let baseZ = (1 - approachRatio) * 1.5 + 0.60;

      // CONTINUOUS TRAJECTORY DRIVE FOR BOTH HANDS IF NOT USER DRAGGED
      if (!isDragging) {
        handA.setPosition(-0.10, 3.0, -baseZ);
        handB.setPosition(0.10, 3.0, baseZ);
      }

      const baseCurl = approachRatio * 0.35 + claspRatio * 0.90;

      handA.setFingerCurl(baseCurl, false);
      handB.setFingerCurl(baseCurl, true);

      if (approachRatio >= 1.0) {
        handA.setAllShieldColors(0x34d399);
        handB.setAllShieldColors(0x34d399);
      } else {
        handA.setAllShieldColors(0x38bdf8);
        handB.setAllShieldColors(0xf97316);
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
